services:
  gpt-register:
    build: .
    ports:
      - "8765:8765"
    environment:
      WEBUI_DATA_DIR: /data
      OPENAI_SENTINEL_CACHE_DIR: /data/sentinel
      OPENAI_SENTINEL_NODE_PATH: ${OPENAI_SENTINEL_NODE_PATH:-node}
      OPENAI_SENTINEL_VERSION: ${OPENAI_SENTINEL_VERSION:-}
      OPENAI_SENTINEL_SDK_URL: ${OPENAI_SENTINEL_SDK_URL:-}
      OPENAI_SENTINEL_AUTO_DISCOVER: ${OPENAI_SENTINEL_AUTO_DISCOVER:-1}
      OPENAI_SENTINEL_RETRY_COUNT: ${OPENAI_SENTINEL_RETRY_COUNT:-2}
      OPENAI_SENTINEL_TIMEOUT_MS: ${OPENAI_SENTINEL_TIMEOUT_MS:-45000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-0}
    volumes:
      - ./data:/data
    restart: unless-stopped
