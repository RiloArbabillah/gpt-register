services:
  gpt-register:
    build: .
    ports:
      - "8765:8765"
    environment:
      WEBUI_DATA_DIR: /data
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-0}
    volumes:
      - ./data:/data
    restart: unless-stopped
